name: FinLit security regression
on:
  pull_request:
  push:
    branches: ['audit/phase2-server-security']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check server.js && node --check js/auth.js && node --check js/database.js && node --check js/account.js && node --check js/registered_users.js
      - run: node --test tests/security.test.js
      - run: npm audit --omit=dev --audit-level=high
